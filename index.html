<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32 Prop Timeline Editor</title>
  <style>
    body {
      background: black;
      color: white;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background: #222;
      padding: 10px;
      text-align: center;
    }
    #timeline {
      display: grid;
      grid-template-columns: 80px repeat(60, 20px); /* 60 seconds timeline */
      gap: 2px;
      overflow-x: auto;
      padding: 10px;
    }
    .track-label {
      background: #333;
      text-align: right;
      padding-right: 10px;
    }
    .cell {
      background: #444;
      height: 30px;
      cursor: pointer;
    }
    .cell.on {
      background: lime;
    }
    #controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      padding: 10px;
    }
    audio {
      width: 80%;
      margin: 10px auto;
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <h1>Prop Director Timeline Editor</h1>
  </header>

  <div id="controls">
    <input type="file" id="audioUpload" accept="audio/*">
    <button onclick="playTimeline()">Play Preview</button>
  </div>

  <audio id="audio" controls></audio>

  <div id="timeline"></div>

  <script>
    const timeline = document.getElementById("timeline");
    const outputs = ["Output 1", "Output 2", "Output 3", "Output 4"];
    const numSeconds = 60;

    outputs.forEach((label, row) => {
      timeline.appendChild(makeLabel(label));
      for (let t = 0; t < numSeconds; t++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.row = row;
        cell.dataset.time = t;
        cell.onclick = () => cell.classList.toggle("on");
        timeline.appendChild(cell);
      }
    });

    function makeLabel(text) {
      const label = document.createElement("div");
      label.className = "track-label";
      label.textContent = text;
      return label;
    }

    const audio = document.getElementById("audio");
    document.getElementById("audioUpload").addEventListener("change", function (e) {
      const file = e.target.files[0];
      if (file) {
        audio.src = URL.createObjectURL(file);
      }
    });

    function playTimeline() {
      const activeCells = document.querySelectorAll(".cell.on");
      const timelineData = Array.from(activeCells).map(cell => ({
        row: parseInt(cell.dataset.row),
        time: parseInt(cell.dataset.time)
      }));

      console.log("Previewing:", timelineData);
      audio.currentTime = 0;
      audio.play();
      // Optional: Visual playback marker or simulate outputs
    }
  </script>
</body>
</html>
