<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prop Director Timeline Editor</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background: #111;
      padding: 10px;
      text-align: center;
    }
    .editor-container {
      overflow-x: auto;
      position: relative;
      padding: 10px;
    }
    .time-ruler {
      display: flex;
      color: #aaa;
      font-size: 0.75rem;
      margin-bottom: 4px;
    }
    .time-ruler div {
      width: 50px;
      text-align: center;
    }
    #waveformContainer {
      position: relative;
    }
    canvas#waveform {
      display: block;
      background: #111;
    }
    .playhead {
      position: absolute;
      top: 0;
      width: 2px;
      background: red;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    .track {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
    }
    .track-label {
      width: 100px;
      text-align: right;
      padding-right: 10px;
      font-size: 0.9rem;
    }
    .track-timeline {
      position: relative;
      flex: 1;
      height: 30px;
      background: #333;
      cursor: crosshair;
    }
    .segment {
      position: absolute;
      top: 0;
      bottom: 0;
      background: lime;
    }
    #controls {
      text-align: center;
      padding: 10px;
    }
    #audio {
      display: block;
      margin: 10px auto;
      width: 90%;
    }
  </style>
</head>
<body>
  <header>
    <h1>Prop Director Timeline Editor</h1>
  </header>

  <div id="controls">
    <label>Background Track: <input type="file" id="bgUpload" accept="audio/*"></label>
    <label>Scare Track: <input type="file" id="audioUpload" accept="audio/*"></label>
    <button onclick="playTimeline()">Play Preview</button>
    <audio id="audio" controls></audio>
  </div>

  <div class="editor-container" id="editorContainer">
    <div class="playhead" id="playhead"></div>
    <div class="time-ruler" id="timeRuler"></div>

    <div id="waveformContainer">
      <canvas id="waveform" width="3000" height="100"></canvas>
    </div>

    <div id="tracks"></div>
  </div>

  <script>
    const outputs = [
      { label: 'Output 1', segments: [] },
      { label: 'Output 2', segments: [] },
      { label: 'Output 3', segments: [] },
      { label: 'Output 4', segments: [] }
    ];

    const waveform = document.getElementById('waveform');
    const ctx = waveform.getContext('2d');
    const audio = document.getElementById('audio');
    const tracksDiv = document.getElementById('tracks');
    const playhead = document.getElementById('playhead');
    const editorContainer = document.getElementById('editorContainer');

    const numSeconds = 60;
    const pxPerSecond = 50;
    const waveformWidth = numSeconds * pxPerSecond;
    waveform.width = waveformWidth;

    // Build time ruler
    const ruler = document.getElementById('timeRuler');
    for (let i = 0; i <= numSeconds; i += 5) {
      const tick = document.createElement('div');
      tick.textContent = `${i}s`;
      tick.style.width = `${pxPerSecond * 5}px`;
      ruler.appendChild(tick);
    }

    // Draw output tracks
    outputs.forEach((output, index) => {
      const row = document.createElement('div');
      row.className = 'track';

      const label = document.createElement('div');
      label.className = 'track-label';
      label.textContent = output.label;

      const timeline = document.createElement('div');
      timeline.className = 'track-timeline';
      timeline.style.width = `${waveformWidth}px`;
      timeline.dataset.index = index;

      let startX = null;
      timeline.onmousedown = (e) => {
        startX = e.offsetX;
      };
      timeline.onmouseup = (e) => {
        if (startX === null) return;
        const x1 = Math.min(startX, e.offsetX);
        const x2 = Math.max(startX, e.offsetX);
        const seg = document.createElement('div');
        seg.className = 'segment';
        seg.style.left = `${x1}px`;
        seg.style.width = `${x2 - x1}px`;
        timeline.appendChild(seg);
        const startTime = Math.round(x1 / pxPerSecond);
        const endTime = Math.round(x2 / pxPerSecond);
        outputs[index].segments.push({ start: startTime, end: endTime });
        startX = null;
      };

      row.appendChild(label);
      row.appendChild(timeline);
      tracksDiv.appendChild(row);
    });

    // Audio + waveform logic
    document.getElementById('audioUpload').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      audio.src = url;
      drawWaveform(file);
    });

    function drawWaveform(file) {
      const audioCtx = new AudioContext();
      const reader = new FileReader();
      reader.onload = function (e) {
        audioCtx.decodeAudioData(e.target.result).then(buffer => {
          const rawData = buffer.getChannelData(0);
          const samples = waveform.width;
          const blockSize = Math.floor(rawData.length / samples);
          const height = waveform.height;

          ctx.clearRect(0, 0, samples, height);
          ctx.fillStyle = '#0f0';

          for (let i = 0; i < samples; i++) {
            let sum = 0;
            for (let j = 0; j < blockSize; j++) {
              sum += Math.abs(rawData[i * blockSize + j]);
            }
            const avg = sum / blockSize;
            const barHeight = avg * height;
            ctx.fillRect(i, (height - barHeight) / 2, 1, barHeight);
          }
        });
      };
      reader.readAsArrayBuffer(file);
    }

    function playTimeline() {
      audio.currentTime = 0;
      audio.play();

      const start = performance.now();
      const totalDuration = audio.duration || 60;

      const update = (now) => {
        const elapsed = (now - start) / 1000;
        const position = elapsed * pxPerSecond;
        playhead.style.left = `${position}px`;

        if (!audio.paused && !audio.ended) {
          requestAnimationFrame(update);
        }
      };

      requestAnimationFrame(update);
    }
  </script>
</body>
</html>
