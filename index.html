<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prop Director Timeline Editor</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background: #111;
      padding: 10px;
      text-align: center;
    }
    .editor-container {
      overflow-x: auto;
      position: relative;
      padding: 10px;
    }
    .timeline-wrapper {
      position: relative;
      width: fit-content;
    }
    .time-ruler {
      display: flex;
      color: #aaa;
      font-size: 0.75rem;
      margin-bottom: 4px;
    }
    .time-ruler div {
      text-align: center;
    }
    canvas#waveform {
      background: #111;
      height: 100px;
      display: block;
    }
    .playhead {
      position: absolute;
      top: 0;
      width: 2px;
      background: red;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      left: 0;
    }
    .output-box {
      border: 1px solid #444;
      padding: 10px;
      margin: 8px 0;
      background: #111;
      width: fit-content;
    }
    .track-label {
      margin-bottom: 4px;
    }
    .track-timeline {
      position: relative;
      height: 30px;
      background: #333;
      cursor: crosshair;
    }
    .segment {
      position: absolute;
      top: 0;
      bottom: 0;
      background: lime;
    }
    #controls {
      text-align: center;
      padding: 10px;
    }
    #zoom-controls {
      text-align: center;
      margin-bottom: 10px;
    }
    #audio {
      display: block;
      margin: 10px auto;
      width: 90%;
    }
    select, input[type="text"], input[type="number"] {
      background: #222;
      color: white;
      border: 1px solid #555;
      margin: 5px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Prop Director Timeline Editor</h1>
  </header>

  <div id="controls">
    <label>Trigger Input Pin:
      <select id="inputPin"></select>
    </label>
    <br>
    <label>Background Track: <input type="file" id="bgUpload" accept="audio/*"></label>
    <label>Scare Track: <input type="file" id="audioUpload" accept="audio/*"></label>
    <button onclick="playTimeline()">Play</button>
    <button onclick="stopTimeline()">Stop</button>
    <button onclick="resetTimeline()">Reset</button>
    <audio id="audio" controls></audio>
    <br>
    <label>Timeline Length (sec): <input type="number" id="manualLength" value="60" min="1" onchange="manualTimelineLength(this.value)"></label>
  </div>

  <div id="zoom-controls">
    <button onclick="zoom(-10)">-</button>
    <button onclick="zoom(10)">+</button>
  </div>

  <div class="editor-container">
    <div class="timeline-wrapper">
      <div class="playhead" id="playhead"></div>
      <div class="time-ruler" id="timeRuler"></div>
      <canvas id="waveform"></canvas>
      <div id="tracks"></div>
    </div>
  </div>

  <script>
    const gpioOptions = [4, 5, 12, 13, 14, 15, 16, 17, 18, 19, 21, 22, 23, 25, 26, 27, 32, 33];
    let usedPins = new Set();
    let numSeconds = 60;
    let pxPerSecond = 50;
    let animationFrame = null;
    let currentBuffer = null;
    let manualOverride = false;

    const outputs = [
      { label: 'Output 1', pin: null, segments: [] },
      { label: 'Output 2', pin: null, segments: [] },
      { label: 'Output 3', pin: null, segments: [] },
      { label: 'Output 4', pin: null, segments: [] }
    ];

    const waveform = document.getElementById('waveform');
    const ctx = waveform.getContext('2d');
    const audio = document.getElementById('audio');
    const tracksDiv = document.getElementById('tracks');
    const playhead = document.getElementById('playhead');
    const inputPinDropdown = document.getElementById('inputPin');
    const ruler = document.getElementById('timeRuler');
    const manualLengthInput = document.getElementById('manualLength');

    function zoom(delta) {
      pxPerSecond = Math.max(10, pxPerSecond + delta);
      setTimelineDuration(numSeconds);
    }

    function manualTimelineLength(value) {
      manualOverride = true;
      setTimelineDuration(parseInt(value));
    }

    function setTimelineDuration(seconds) {
      numSeconds = seconds;
      const width = Math.ceil(numSeconds * pxPerSecond);
      waveform.width = width;
      ruler.innerHTML = '';
      ruler.style.width = `${width}px`;
      for (let i = 0; i <= numSeconds; i += 5) {
        const tick = document.createElement('div');
        tick.textContent = `${i}s`;
        tick.style.width = `${pxPerSecond * 5}px`;
        ruler.appendChild(tick);
      }
      drawOutputTracks(width);
      if (currentBuffer) drawWaveform(currentBuffer);
    }

    function populateDropdown(dropdown, selectedPin) {
      dropdown.innerHTML = '<option value="">-- Select Pin --</option>';
      gpioOptions.forEach(pin => {
        const option = document.createElement('option');
        option.value = pin;
        option.textContent = `GPIO ${pin}`;
        option.disabled = usedPins.has(pin) && pin !== selectedPin;
        if (pin === selectedPin) option.selected = true;
        dropdown.appendChild(option);
      });
    }

    function drawOutputTracks(width) {
      tracksDiv.innerHTML = '';
      outputs.forEach((output, index) => {
        const box = document.createElement('div');
        box.className = 'output-box';

        const labelInput = document.createElement('input');
        labelInput.type = 'text';
        labelInput.value = output.label;
        labelInput.onchange = () => { output.label = labelInput.value; };

        const pinDropdown = document.createElement('select');
        populateDropdown(pinDropdown, output.pin);
        pinDropdown.addEventListener('change', function () {
          if (output.pin) usedPins.delete(output.pin);
          output.pin = parseInt(this.value);
          usedPins.add(output.pin);
          drawOutputTracks(width);
        });

        const timeline = document.createElement('div');
        timeline.className = 'track-timeline';
        timeline.style.width = `${width}px`;

        output.segments.forEach(seg => {
          const segDiv = document.createElement('div');
          segDiv.className = 'segment';
          segDiv.style.left = `${seg.start * pxPerSecond}px`;
          segDiv.style.width = `${(seg.end - seg.start) * pxPerSecond}px`;
          timeline.appendChild(segDiv);
        });

        let startX = null;
        timeline.onmousedown = (e) => { startX = e.offsetX; };
        timeline.onmouseup = (e) => {
          if (startX === null) return;
          const x1 = Math.min(startX, e.offsetX);
          const x2 = Math.max(startX, e.offsetX);
          const start = x1 / pxPerSecond;
          const end = x2 / pxPerSecond;
          output.segments.push({ start, end });
          drawOutputTracks(width);
        };

        box.appendChild(labelInput);
        box.appendChild(pinDropdown);
        box.appendChild(timeline);
        tracksDiv.appendChild(box);
      });
    }

    document.getElementById('audioUpload').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      audio.src = url;
      const audioCtx = new AudioContext();
      const reader = new FileReader();
      reader.onload = function (event) {
        audioCtx.decodeAudioData(event.target.result).then(buffer => {
          currentBuffer = buffer;
          if (!manualOverride) {
            manualLengthInput.value = Math.ceil(buffer.duration);
            setTimelineDuration(buffer.duration);
          } else {
            setTimelineDuration(parseInt(manualLengthInput.value));
          }
          drawWaveform(buffer);
        });
      };
      reader.readAsArrayBuffer(file);
    });

    function drawWaveform(buffer) {
      const rawData = buffer.getChannelData(0);
      const samples = waveform.width;
      const blockSize = Math.floor(rawData.length / samples);
      const height = waveform.height;

      ctx.clearRect(0, 0, samples, height);
      ctx.fillStyle = '#0f0';

      for (let i = 0; i < samples; i++) {
        let sum = 0;
        for (let j = 0; j < blockSize; j++) {
          sum += Math.abs(rawData[i * blockSize + j]);
        }
        const avg = sum / blockSize;
        const barHeight = avg * height;
        ctx.fillRect(i, (height - barHeight) / 2, 1, barHeight);
      }
    }

    function playTimeline() {
      audio.currentTime = 0;
      audio.play();
      updatePlayhead();
    }

    function stopTimeline() {
      audio.pause();
      cancelAnimationFrame(animationFrame);
    }

    function resetTimeline() {
      stopTimeline();
      audio.currentTime = 0;
      playhead.style.left = '0px';
    }

    function updatePlayhead() {
      animationFrame = requestAnimationFrame(function step() {
        const position = audio.currentTime * pxPerSecond;
        playhead.style.left = `${position}px`;
        if (!audio.paused && !audio.ended) {
          animationFrame = requestAnimationFrame(step);
        }
      });
    }
  </script>
</body>
</html>
