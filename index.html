<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prop Director</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background: #111;
      padding: 10px;
      text-align: center;
    }
    .channel {
      margin: 10px;
      padding: 10px;
      background: #111;
      border: 1px solid #444;
    }
    .channel label {
      margin-right: 10px;
    }
    .timeline-track {
      position: relative;
      height: 30px;
      background: #333;
      margin-top: 10px;
      cursor: crosshair;
    }
    .segment {
      position: absolute;
      top: 0;
      bottom: 0;
      background: lime;
    }
    #controls, #audioSection {
      padding: 10px;
      text-align: center;
    }
    #inputLabelEditor {
      padding: 10px;
      background: #111;
    }
    input[type="text"], input[type="number"] {
      background: #222;
      color: #fff;
      border: 1px solid #555;
      padding: 2px 6px;
    }
    canvas#waveform {
      display: block;
      width: 100%;
      max-width: 1000px;
      height: 100px;
      background: #111;
      margin: 10px auto;
    }
  </style>
</head>
<body>
  <header>
    <h1>Prop Director Timeline Editor</h1>
  </header>

  <div id="inputLabelEditor">
    Trigger Input Label:
    <input type="text" id="inputLabel" value="Trigger Sensor" onchange="updateInputLabel(this.value)">
  </div>

  <div id="controls">
    <label>Background Track:
      <input type="file" id="bgUpload" accept="audio/*">
    </label>
    <label>Scare Track:
      <input type="file" id="audioUpload" accept="audio/*">
    </label>
    <button onclick="playTimeline()">Play Scare Preview</button>
  </div>

  <div id="audioSection">
    <canvas id="waveform" width="1000" height="100"></canvas>
    <audio id="audio" controls></audio>
  </div>

  <div id="channels"></div>

  <script>
    const outputData = [
      { label: 'Output 1', pin: 16, segments: [] },
      { label: 'Output 2', pin: 17, segments: [] },
      { label: 'Output 3', pin: 18, segments: [] },
      { label: 'Output 4', pin: 19, segments: [] }
    ];

    const numSeconds = 60;
    const pxPerSecond = 10;
    const trackWidth = numSeconds * pxPerSecond;
    const channelsContainer = document.getElementById('channels');

    outputData.forEach((output, index) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'channel';

      const labelInput = `<label>Label: <input type="text" value="${output.label}" onchange="outputData[${index}].label = this.value"></label>`;
      const pinInput = `<label>Pin: <input type="number" value="${output.pin}" onchange="outputData[${index}].pin = parseInt(this.value)"></label>`;

      const track = document.createElement('div');
      track.className = 'timeline-track';
      track.style.width = `${trackWidth}px`;
      track.dataset.index = index;

      let startX = null;
      track.onmousedown = (e) => {
        const rect = track.getBoundingClientRect();
        startX = e.clientX - rect.left;
      };
      track.onmouseup = (e) => {
        if (startX === null) return;
        const rect = track.getBoundingClientRect();
        const endX = e.clientX - rect.left;
        const [x1, x2] = [startX, endX].sort((a, b) => a - b);
        const seg = document.createElement('div');
        seg.className = 'segment';
        seg.style.left = `${x1}px`;
        seg.style.width = `${x2 - x1}px`;
        track.appendChild(seg);

        const startTime = Math.round(x1 / pxPerSecond);
        const endTime = Math.round(x2 / pxPerSecond);
        outputData[index].segments.push({ start: startTime, end: endTime });
        startX = null;
      };

      wrapper.innerHTML = labelInput + pinInput;
      wrapper.appendChild(track);
      channelsContainer.appendChild(wrapper);
    });

    const audio = document.getElementById('audio');
    const waveform = document.getElementById('waveform');
    const ctx = waveform.getContext('2d');

    document.getElementById('audioUpload').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      audio.src = url;
      drawWaveform(file);
    });

    function drawWaveform(file) {
      const audioCtx = new AudioContext();
      const reader = new FileReader();
      reader.onload = function (e) {
        audioCtx.decodeAudioData(e.target.result).then(buffer => {
          const rawData = buffer.getChannelData(0);
          const samples = waveform.width;
          const blockSize = Math.floor(rawData.length / samples);
          const height = waveform.height;

          ctx.clearRect(0, 0, waveform.width, height);
          ctx.fillStyle = '#0f0';

          for (let i = 0; i < samples; i++) {
            let sum = 0;
            for (let j = 0; j < blockSize; j++) {
              sum += Math.abs(rawData[i * blockSize + j]);
            }
            const average = sum / blockSize;
            const barHeight = average * height;
            ctx.fillRect(i, (height - barHeight) / 2, 1, barHeight);
          }
        }).catch(err => console.error('decodeAudioData error:', err));
      };
      reader.readAsArrayBuffer(file);
    }

    function playTimeline() {
      audio.currentTime = 0;
      audio.play();
      console.log('Scare track playback started.');
    }

    function updateInputLabel(val) {
      console.log('Input label updated:', val);
    }
  </script>
</body>
</html>
