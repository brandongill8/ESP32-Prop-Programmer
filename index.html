<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prop Director</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background: #111;
      padding: 10px;
      text-align: center;
    }
    .channel {
      margin: 10px;
      padding: 10px;
      background: #111;
      border: 1px solid #444;
    }
    .channel label {
      margin-right: 10px;
    }
    .timeline {
      display: grid;
      grid-template-columns: repeat(60, 10px);
      gap: 2px;
      margin-top: 10px;
      overflow-x: auto;
    }
    .cell {
      width: 10px;
      height: 20px;
      background: #333;
      cursor: pointer;
    }
    .cell.on {
      background: lime;
    }
    #controls, #audioSection {
      padding: 10px;
      text-align: center;
    }
    #inputLabelEditor {
      padding: 10px;
      background: #111;
    }
    input[type="text"], input[type="number"] {
      background: #222;
      color: #fff;
      border: 1px solid #555;
      padding: 2px 6px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Prop Director Timeline Editor</h1>
  </header>

  <div id="inputLabelEditor">
    Trigger Input Label:
    <input type="text" id="inputLabel" value="Trigger Sensor" onchange="updateInputLabel(this.value)">
  </div>

  <div id="controls">
    <label>Background Track:
      <input type="file" id="bgUpload" accept="audio/*">
    </label>
    <label>Scare Track:
      <input type="file" id="audioUpload" accept="audio/*">
    </label>
    <button onclick="playTimeline()">Play Scare Preview</button>
  </div>

  <div id="audioSection">
    <audio id="audio" controls></audio>
  </div>

  <div id="channels"></div>

  <script>
    const outputData = [
      { label: 'Output 1', pin: 16 },
      { label: 'Output 2', pin: 17 },
      { label: 'Output 3', pin: 18 },
      { label: 'Output 4', pin: 19 }
    ];

    const channelsContainer = document.getElementById('channels');

    outputData.forEach((output, index) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'channel';

      wrapper.innerHTML = `
        <label>Label: <input type="text" value="${output.label}" onchange="outputData[${index}].label = this.value"></label>
        <label>Pin: <input type="number" value="${output.pin}" onchange="outputData[${index}].pin = parseInt(this.value)"></label>
        <div class="timeline" id="timeline-${index}"></div>
      `;

      channelsContainer.appendChild(wrapper);

      const timeline = wrapper.querySelector('.timeline');
      for (let i = 0; i < 60; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.output = index;
        cell.dataset.time = i;
        cell.onclick = () => cell.classList.toggle('on');
        timeline.appendChild(cell);
      }
    });

    const audio = document.getElementById('audio');
    document.getElementById('audioUpload').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (file) {
        audio.src = URL.createObjectURL(file);
      }
    });

    function playTimeline() {
      audio.currentTime = 0;
      audio.play();
      console.log('Timeline playback triggered');
    }

    function updateInputLabel(val) {
      console.log('Input label updated:', val);
    }
  </script>
</body>
</html>
