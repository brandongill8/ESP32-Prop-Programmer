<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prop Director Timeline Editor</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background: #111;
      padding: 10px;
      text-align: center;
    }
    .editor-container {
      overflow-x: auto;
      position: relative;
      padding: 10px;
    }
    .timeline-wrapper {
      display: grid;
      grid-template-columns: 150px 1fr;
      position: relative;
      width: 100%;
    }
    .time-ruler {
      grid-column: 2;
      display: flex;
      color: #aaa;
      font-size: 0.75rem;
      margin-bottom: 4px;
    }
    .time-ruler div {
      text-align: center;
    }
    canvas#waveform {
      grid-column: 2;
      background: #111;
      height: 100px;
      display: block;
    }
    .playhead {
      position: absolute;
      top: 0;
      width: 2px;
      background: red;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    .track {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
    }
    .track-label {
      width: 150px;
      text-align: right;
      padding-right: 10px;
      font-size: 0.9rem;
    }
    .track-timeline {
      position: relative;
      height: 30px;
      background: #333;
      cursor: crosshair;
    }
    .segment {
      position: absolute;
      top: 0;
      bottom: 0;
      background: lime;
    }
    #controls {
      text-align: center;
      padding: 10px;
    }
    #zoom-controls {
      text-align: center;
      margin-bottom: 10px;
    }
    #audio {
      display: block;
      margin: 10px auto;
      width: 90%;
    }
    select, input[type="text"] {
      background: #222;
      color: white;
      border: 1px solid #555;
      margin-left: 5px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Prop Director Timeline Editor</h1>
  </header>

  <div id="controls">
    <label>Trigger Input Pin:
      <select id="inputPin"></select>
    </label>
    <br>
    <label>Background Track: <input type="file" id="bgUpload" accept="audio/*"></label>
    <label>Scare Track: <input type="file" id="audioUpload" accept="audio/*"></label>
    <button onclick="playTimeline()">Play</button>
    <button onclick="stopTimeline()">Stop</button>
    <button onclick="resetTimeline()">Reset</button>
    <audio id="audio" controls></audio>
  </div>

  <div id="zoom-controls">
    <button onclick="zoom(-10)">-</button>
    <button onclick="zoom(10)">+</button>
  </div>

  <div class="editor-container" id="editorContainer">
    <div class="playhead" id="playhead"></div>
    <div class="timeline-wrapper" id="timelineWrapper">
      <div></div>
      <div class="time-ruler" id="timeRuler"></div>
      <div></div>
      <canvas id="waveform"></canvas>
      <div id="labels"></div>
      <div id="tracks"></div>
    </div>
  </div>

  <script>
    const gpioOptions = [4, 5, 12, 13, 14, 15, 16, 17, 18, 19, 21, 22, 23, 25, 26, 27, 32, 33];
    let usedPins = new Set();
    let numSeconds = 60;
    let pxPerSecond = 50;
    let animationFrame = null;

    const outputs = [
      { label: 'Output 1', pin: null, segments: [] },
      { label: 'Output 2', pin: null, segments: [] },
      { label: 'Output 3', pin: null, segments: [] },
      { label: 'Output 4', pin: null, segments: [] }
    ];

    const waveform = document.getElementById('waveform');
    const ctx = waveform.getContext('2d');
    const audio = document.getElementById('audio');
    const tracksDiv = document.getElementById('tracks');
    const labelsDiv = document.getElementById('labels');
    const playhead = document.getElementById('playhead');
    const inputPinDropdown = document.getElementById('inputPin');
    const ruler = document.getElementById('timeRuler');

    function zoom(delta) {
      pxPerSecond = Math.max(10, pxPerSecond + delta);
      if (audio.duration) setTimelineDuration(audio.duration);
    }

    function setTimelineDuration(seconds) {
      numSeconds = seconds;
      const width = Math.ceil(numSeconds * pxPerSecond);
      waveform.width = width;
      ruler.innerHTML = '';
      ruler.style.width = `${width}px`;
      for (let i = 0; i <= numSeconds; i += 5) {
        const tick = document.createElement('div');
        tick.textContent = `${i}s`;
        tick.style.width = `${pxPerSecond * 5}px`;
        ruler.appendChild(tick);
      }
      drawOutputTracks(width);
    }

    function populateDropdown(dropdown, selectedPin) {
      dropdown.innerHTML = '<option value="">-- Select Pin --</option>';
      gpioOptions.forEach(pin => {
        const option = document.createElement('option');
        option.value = pin;
        option.textContent = `GPIO ${pin}`;
        option.disabled = usedPins.has(pin) && pin !== selectedPin;
        if (pin === selectedPin) option.selected = true;
        dropdown.appendChild(option);
      });
    }

    let inputPin = null;
    populateDropdown(inputPinDropdown, inputPin);
    inputPinDropdown.addEventListener('change', (e) => {
      if (inputPin) usedPins.delete(parseInt(inputPin));
      inputPin = parseInt(e.target.value);
      usedPins.add(inputPin);
      refreshAllDropdowns();
    });

    function refreshAllDropdowns() {
      document.querySelectorAll('.pin-select').forEach((dropdown, index) => {
        const current = outputs[index].pin;
        populateDropdown(dropdown, current);
      });
      populateDropdown(inputPinDropdown, inputPin);
    }

    function drawOutputTracks(width) {
      tracksDiv.innerHTML = '';
      labelsDiv.innerHTML = '';
      outputs.forEach((output, index) => {
        const labelWrapper = document.createElement('div');
        labelWrapper.className = 'track-label';
        labelWrapper.innerHTML = `<input type="text" value="${output.label}" onchange="outputs[${index}].label = this.value">`;

        const pinDropdown = document.createElement('select');
        pinDropdown.className = 'pin-select';
        populateDropdown(pinDropdown, output.pin);
        pinDropdown.addEventListener('change', function () {
          if (outputs[index].pin) usedPins.delete(outputs[index].pin);
          outputs[index].pin = parseInt(this.value);
          usedPins.add(outputs[index].pin);
          refreshAllDropdowns();
        });

        const labelContainer = document.createElement('div');
        labelContainer.appendChild(labelWrapper);
        labelContainer.appendChild(pinDropdown);
        labelsDiv.appendChild(labelContainer);

        const timeline = document.createElement('div');
        timeline.className = 'track-timeline';
        timeline.style.width = `${width}px`;
        timeline.dataset.index = index;

        let startX = null;
        timeline.onmousedown = (e) => { startX = e.offsetX; };
        timeline.onmouseup = (e) => {
          if (startX === null) return;
          const x1 = Math.min(startX, e.offsetX);
          const x2 = Math.max(startX, e.offsetX);
          const seg = document.createElement('div');
          seg.className = 'segment';
          seg.style.left = `${x1}px`;
          seg.style.width = `${x2 - x1}px`;
          timeline.appendChild(seg);
          const startTime = Math.round(x1 / pxPerSecond);
          const endTime = Math.round(x2 / pxPerSecond);
          outputs[index].segments.push({ start: startTime, end: endTime });
          startX = null;
        };

        tracksDiv.appendChild(timeline);
      });
    }

    document.getElementById('audioUpload').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      audio.src = url;
      const audioCtx = new AudioContext();
      const reader = new FileReader();
      reader.onload = function (event) {
        audioCtx.decodeAudioData(event.target.result).then(buffer => {
          setTimelineDuration(buffer.duration);
          drawWaveform(buffer);
        });
      };
      reader.readAsArrayBuffer(file);
    });

    function drawWaveform(buffer) {
      const rawData = buffer.getChannelData(0);
      const samples = waveform.width;
      const blockSize = Math.floor(rawData.length / samples);
      const height = waveform.height;

      ctx.clearRect(0, 0, samples, height);
      ctx.fillStyle = '#0f0';

      for (let i = 0; i < samples; i++) {
        let sum = 0;
        for (let j = 0; j < blockSize; j++) {
          sum += Math.abs(rawData[i * blockSize + j]);
        }
        const avg = sum / blockSize;
        const barHeight = avg * height;
        ctx.fillRect(i, (height - barHeight) / 2, 1, barHeight);
      }
    }

    function playTimeline() {
      audio.currentTime = 0;
      audio.play();
      updatePlayhead();
    }

    function stopTimeline() {
      audio.pause();
      cancelAnimationFrame(animationFrame);
    }

    function resetTimeline() {
      stopTimeline();
      audio.currentTime = 0;
      playhead.style.left = '0px';
    }

    function updatePlayhead() {
      animationFrame = requestAnimationFrame(function step() {
        const position = audio.currentTime * pxPerSecond;
        playhead.style.left = `${position}px`;
        if (!audio.paused && !audio.ended) {
          animationFrame = requestAnimationFrame(step);
        }
      });
    }
  </script>
</body>
</html>
